<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoring Status Toko & Follow Up Lapangan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ebf8ff 0%, #edf2f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-size: 22px;
            color: #2b6cb0;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 13px;
            color: #718096;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #718096;
            cursor: pointer;
            font-size: 13px;
            user-select: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #2b6cb0;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background-color: #2c5282;
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        .btn-login:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        .error-message {
            background-color: #fed7d7;
            color: #9b2c2c;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .login-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            border-top: 1px dashed #e2e8f0;
            padding-top: 15px;
        }

        /* Loading Spinner */
        .spinner-login {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h2>Portal Monitoring Toko</h2>
            <p>EDP Samarinda</p>
        </div>

        <div id="alert-error" class="error-message"></div>

        <form id="form-login" onsubmit="prosesLogin(event)">
            <div class="form-group">
                <label for="username">Username / NIK</label>
                <input type="text" id="username" placeholder="Masukkan username..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Masukkan password..." required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                <span id="btn-text">Masuk Sistem</span>
            </button>
        </form>

        <div class="login-footer">
            Aldoni Jelang R. - EDP Samarinda &copy; 2026
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz_tNHAoQAjhsEvny5l2_aUYwwdTegK3j4X-jEyS9KN06LUGV17suZkOZdYP19V_P_1/exec";

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById("password");
            pwdInput.type = pwdInput.type === "password" ? "text" : "password";
        }

        async function prosesLogin(e) {
            e.preventDefault();
            const userIn = document.getElementById("username").value.trim();
            const passIn = document.getElementById("password").value.trim();
            const btnSubmit = document.getElementById("btn-submit");
            const btnText = document.getElementById("btn-text");
            const alertError = document.getElementById("alert-error");

            alertError.style.display = "none";
            alertError.innerText = "";

            btnSubmit.disabled = true;
            btnText.innerHTML = '<span class="spinner-login"></span> Memeriksa...';

            try {
                // 1. Ambil data dari GAS endpoint dengan tab user_data
                const response = await fetch(`${GAS_URL}?tab=${encodeURIComponent('user_data')}`);
                if (!response.ok) throw new Error("Gagal mengambil data dari server GAS.");

                // 2. Parse hasil JSON dari server
                const dataUser = await response.json();

                if (!Array.isArray(dataUser) || dataUser.length === 0) {
                    throw new Error("Data pengguna tidak ditemukan pada sheet user_data.");
                }

                // 3. Cari pengguna secara fleksibel (pencocokan nama kolom otomatis)
                const userValid = dataUser.find(u => {
                    const keys = Object.keys(u);
                    const userKey = keys.find(k => /username|user|nik|id/i.test(k));
                    const passKey = keys.find(k => /password|pass|pin/i.test(k));

                    const usernameVal = userKey && u[userKey] !== undefined ? String(u[userKey]).trim().toLowerCase() : "";
                    const passwordVal = passKey && u[passKey] !== undefined ? String(u[passKey]).trim() : "";

                    return usernameVal === userIn.toLowerCase() && passwordVal === passIn;
                });

                if (userValid) {
                    const keys = Object.keys(userValid);
                    const namaKey = keys.find(k => /nama.*edp|nama|user|pic/i.test(k));
                    const roleKey = keys.find(k => /role|peran|jabatan|akses/i.test(k));

                    const namaUser = namaKey && userValid[namaKey] ? String(userValid[namaKey]).trim() : userIn;
                    const roleUser = roleKey && userValid[roleKey] ? String(userValid[roleKey]).trim() : "EDP Cabang";

                    sessionStorage.setItem("isLoggedIn", "true");
                    sessionStorage.setItem("userNama", namaUser);
                    sessionStorage.setItem("userRole", roleUser);

                    window.location.href = "index.html";
                } else {
                    alertError.innerText = "Username atau Password salah!";
                    alertError.style.display = "block";
                }
            } catch (err) {
                console.error("Login error:", err);
                alertError.innerText = err.message || "Gagal terhubung ke database user.";
                alertError.style.display = "block";
            } finally {
                btnSubmit.disabled = false;
                btnText.innerText = "Masuk Sistem";
            }
        }
    </script>
</body>
</html>
