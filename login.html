<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoring Status Toko & Follow Up Lapangan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ebf8ff 0%, #edf2f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-size: 22px;
            color: #2b6cb0;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 13px;
            color: #718096;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #718096;
            cursor: pointer;
            font-size: 13px;
            user-select: none;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #2b6cb0;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover {
            background-color: #2c5282;
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        .btn-login:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }

        .error-message {
            background-color: #fed7d7;
            color: #9b2c2c;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .login-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            border-top: 1px dashed #e2e8f0;
            padding-top: 15px;
        }

        /* Loading Spinner */
        .spinner-login {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
                /* --- TRANSISI HALUS (GEMINI STYLE) --- */
        .sidebar, .main-content, .footer-copyright {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* TOMBOL TOGGLE SIDEBAR */
        .btn-toggle-sidebar {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
            margin-left: auto;
        }
        .btn-toggle-sidebar:hover {
            background-color: #334155;
            color: #ffffff;
        }

        /* ========================================================
        SIDEBAR MODE DITUTUP (COLLAPSED / RAMPING STYLE GEMINI)
        ======================================================== */
        .sidebar.collapsed {
            width: 56px; /* Sangat ringkas khas Gemini */
        }

        /* Header saat Ditutup: Sembunyikan Logo & Judul, Hanya Sisa Tombol ☰ Di Tengah */
        .sidebar.collapsed .sidebar-header {
            padding: 12px 0;
            justify-content: center;
        }
        .sidebar.collapsed .sidebar-header span:first-child,
        .sidebar.collapsed .sidebar-header h3 {
            display: none;
        }
        .sidebar.collapsed .btn-toggle-sidebar {
            margin-left: 0;
        }

        /* Menu saat Ditutup: Ikon Lingkaran Presisi Di Tengah */
        .sidebar.collapsed .sidebar-menu {
            padding: 15px 0;
            align-items: center;
        }
        .sidebar.collapsed .sidebar-menu li {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .sidebar.collapsed .sidebar-menu li a {
            width: 40px;
            height: 40px;
            padding: 0;
            justify-content: center;
            border-radius: 50%; /* Ikon berbentuk lingkaran melayang */
            font-size: 18px;
        }
        .sidebar.collapsed .sidebar-menu li a span:nth-child(2) {
            display: none; /* Sembunyikan Teks Menu */
        }

        /* Footer Logout saat Ditutup */
        .sidebar.collapsed .sidebar-footer {
            padding: 12px 0;
            display: flex;
            justify-content: center;
        }
        .sidebar.collapsed .btn-sidebar-logout {
            width: 40px;
            height: 40px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
        }
        .sidebar.collapsed .btn-sidebar-logout span:nth-child(2) {
            display: none; /* Sembunyikan Teks Logout */
        }

        /* PENYESUAIAN AREA KONTEN & FOOTER */
        .main-content.expanded {
            margin-left: 56px;
            width: calc(100% - 56px);
        }
        .footer-copyright.expanded {
            left: 56px;
            width: calc(100% - 56px);
        }
    </style>
</head>
<body>

        <div class="login-card">
            <div class="login-header">
                <h2>Portal Monitoring Toko</h2>
                <p>EDP Samarinda</p>
            </div>

        <div id="alert-error" class="error-message"></div>

        <form id="form-login" onsubmit="prosesLogin(event)">
            <div class="form-group">
                <label for="username">Username / NIK</label>
                <input type="text" id="username" placeholder="Masukkan username..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Masukkan password..." required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                <span id="btn-text">Masuk Sistem</span>
            </button>
        </form>

        

        <div class="login-footer">
            Aldoni Jelang R. - EDP Samarinda &copy; 2026
        </div>
    </div>

    
    <script>
    function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.querySelector(".main-content");
        const footer = document.querySelector(".footer-copyright");

        sidebar.classList.toggle("collapsed");
        if (mainContent) mainContent.classList.toggle("expanded");
        if (footer) footer.classList.toggle("expanded");

        const isCollapsed = sidebar.classList.contains("collapsed");
        localStorage.setItem("sidebarCollapsed", isCollapsed ? "true" : "false");
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (localStorage.getItem("sidebarCollapsed") === "true") {
            const sidebar = document.getElementById("sidebar");
            const mainContent = document.querySelector(".main-content");
            const footer = document.querySelector(".footer-copyright");

            if (sidebar) sidebar.classList.add("collapsed");
            if (mainContent) mainContent.classList.add("expanded");
            if (footer) footer.classList.add("expanded");
        }
    });
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById("password");
            pwdInput.type = pwdInput.type === "password" ? "text" : "password";
        }

        async function prosesLogin(e) {
            e.preventDefault();
            const userIn = document.getElementById("username").value.trim();
            const passIn = document.getElementById("password").value.trim();
            const btnSubmit = document.getElementById("btn-submit");
            const btnText = document.getElementById("btn-text");
            const alertError = document.getElementById("alert-error");

            // Sembunyikan alert error lama
            alertError.style.display = "none";
            alertError.innerText = "";

            // Set state tombol ke loading
            btnSubmit.disabled = true;
            btnText.innerHTML = '<span class="spinner-login"></span> Memeriksa...';

            try {
                // Mengakses tab user_data pada SheetBest
                const response = await fetch("https://api.sheetbest.com/sheets/478b0475-ac28-4edd-a01e-7e87ff27ac26/tabs/user_data");
                const dataUser = await response.json();

                // Mencari username dan password yang cocok
                const userValid = dataUser.find(u => 
                    (u.USERNAME || "").toString().toLowerCase() === userIn.toLowerCase() &&
                    (u.PASSWORD || "").toString() === passIn
                );

                if (userValid) {
                    // Simpan status login, nama, dan role ke sessionStorage
                    sessionStorage.setItem("isLoggedIn", "true");
                    sessionStorage.setItem("userNama", userValid.NAMA_EDP || userValid.USERNAME);
                    sessionStorage.setItem("userRole", userValid.ROLE || "Pengguna");

                    // Langsung redirect ke dashboard utama
                    window.location.href = "index.html";
                } else {
                    alertError.innerText = "Username atau Password salah!";
                    alertError.style.display = "block";
                }
            } catch (err) {
                console.error("Login error:", err);
                alertError.innerText = "Gagal terhubung ke database user.";
                alertError.style.display = "block";
            } finally {
                btnSubmit.disabled = false;
                btnText.innerText = "Masuk Sistem";
            }
        }
    </script>
</body>
</html>
